<script>
  // 아이폰·맥은 바로 App Store로. 그 외(안드로이드·PC)는 버튼과 안내만 보여준다 — Android 버전은 준비 중.
  (function () {
    var STORE = 'https://apps.apple.com/kr/app/id6791080024';
    var ua = navigator.userAgent || '';
    var apple = /iPhone|iPad|iPod|Macintosh/.test(ua);
    if (apple) { location.replace(STORE); return; }
    if (/Android/.test(ua)) {
      document.getElementById('note').textContent = 'Android 버전은 준비 중이에요. 지금은 iPhone에서 이용할 수 있어요.';
    }
  })();
</script>
